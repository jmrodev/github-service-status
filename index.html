<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub Service Status</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --btn-active: #1f6feb;
      --badge-open: #238636;
      --badge-pr: #8957e5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand { font-size: 18px; font-weight: 600; color: #f0f6fc; }
    .meta { color: var(--text-muted); font-size: 12px; }
    .filters {
      padding: 16px 24px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    button {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover { background: #21262d; }
    button.on { background: var(--btn-active); border-color: var(--btn-active); color: #fff; font-weight: 500; }
    main {
      padding: 0 24px 40px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card h2 { margin: 0; font-size: 16px; word-break: break-all; }
    .card h2 a { color: var(--accent); text-decoration: none; }
    .card h2 a:hover { text-decoration: underline; }
    .stats-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .pill {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2px 10px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .pill.has-items { color: #f0f6fc; border-color: #484f58; }
    .section-title { font-weight: 600; font-size: 12px; color: var(--text-muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; display: flex; justify-content: space-between; }
    .list-item { font-size: 13px; padding: 3px 0; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
    .list-item a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .list-item a:hover { text-decoration: underline; }
    .item-title { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; }
    .author-tag { color: var(--text-muted); font-size: 11px; font-weight: 500; }
    .branches-wrap { display: flex; gap: 6px; flex-wrap: wrap; }
    .branch-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-family: monospace;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      user-select: none;
    }
    .branch-btn:hover { background: #21262d; border-color: var(--accent); }
    .branch-btn.active { background: var(--btn-active); border-color: var(--btn-active); color: #fff; font-weight: 600; }
    .branch-author { opacity: 0.8; font-size: 11px; font-weight: normal; margin-left: 2px; }
    .branch-ext { color: var(--text-muted); font-size: 11px; text-decoration: none; margin-left: 4px; }
    .branch-ext:hover { color: var(--accent); }
    .badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
    }
    .badge-open { background: var(--badge-open); }
    .badge-pr { background: var(--badge-pr); }
    .empty-state { color: var(--text-muted); font-style: italic; font-size: 12px; }
    code { font-family: monospace; font-size: 12px; background: var(--bg); padding: 1px 4px; border-radius: 4px; }
    .comment-box { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 12px; margin-top: 2px; }
    .comment-box a { color: var(--accent); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <div>
      <span class="brand">GitHub Service Status</span>
    </div>
    <div class="meta" id="meta-info">Cargando...</div>
  </header>

  <div class="filters" id="filter-bar">
    <button data-filter="all" class="on">Todos</button>
  </div>

  <main id="main-content"></main>

  <script>
    let rawData = null;
    let activeFilter = 'all';
    const activeBranchMap = {};

    fetch('./status.json')
      .then(res => res.json())
      .then(data => {
        rawData = data;
        initFilters();
        render();
      })
      .catch(err => {
        document.getElementById('meta-info').textContent = 'Error al cargar status.json';
        console.error(err);
      });

    function initFilters() {
      const filterBar = document.getElementById('filter-bar');
      const formattedDate = new Date(rawData.generated_at).toLocaleString();
      document.getElementById('meta-info').textContent = `Generado: ${formattedDate} (${rawData.mode || 'live'}) · Repos: ${rawData.total_repos || rawData.repos.length}`;

      const orgs = new Set();
      (rawData.repos || []).forEach(r => {
        if (r.repo && r.repo.includes('/')) {
          const parts = r.repo.split('/');
          orgs.add(parts[0]);
        }
      });

      orgs.forEach(org => {
        const btn = document.createElement('button');
        btn.dataset.filter = org;
        btn.textContent = org;
        filterBar.appendChild(btn);
      });

      filterBar.querySelectorAll('button').forEach(btn => {
        btn.onclick = () => {
          activeFilter = btn.dataset.filter;
          filterBar.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === btn));
          render();
        };
      });
    }

    function renderCommitsList(commits) {
      if (!commits || !commits.length) {
        return '<div class="empty-state">Sin commits en esta rama</div>';
      }
      return commits.slice(0, 5).map(c => `
        <div class="list-item">
          <a href="${c.html_url || '#'}" target="_blank" rel="noopener"><code>${escapeHtml(c.sha || '')}</code></a>
          ${c.author ? `<span class="author-tag">@${escapeHtml(c.author)}</span>` : ''}
          <span class="item-title">${escapeHtml(c.msg || '')}</span>
        </div>
      `).join('');
    }

    function render() {
      const main = document.getElementById('main-content');
      main.innerHTML = '';

      if (!rawData || !rawData.repos) return;

      const filtered = rawData.repos.filter(r => {
        if (activeFilter === 'all') return true;
        return r.repo.startsWith(activeFilter + '/');
      });

      filtered.forEach(r => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.repo = r.repo;

        const openIssues = (r.issues || []).filter(i => i.state && i.state.toUpperCase() === 'OPEN');
        const openPRs = (r.prs || []).filter(p => p.state && p.state.toUpperCase() === 'OPEN');
        const branches = (r.branches && Array.isArray(r.branches)) ? r.branches : [];
        const comments = (r.comments && Array.isArray(r.comments)) ? r.comments : [];

        // Determine active branch for this card
        if (!activeBranchMap[r.repo] && branches.length > 0) {
          activeBranchMap[r.repo] = branches[0].name;
        }
        const currentBranchName = activeBranchMap[r.repo] || (branches[0] ? branches[0].name : '');
        const currentBranchObj = branches.find(b => b.name === currentBranchName) || branches[0];
        const commits = (currentBranchObj && currentBranchObj.commits) ? currentBranchObj.commits : (r.commits || []);

        card.innerHTML = `
          <h2><a href="${r.url}" target="_blank" rel="noopener">${escapeHtml(r.repo)}</a></h2>
          <div class="stats-row">
            <span class="pill ${openPRs.length ? 'has-items' : ''}">PRs ${openPRs.length}</span>
            <span class="pill ${openIssues.length ? 'has-items' : ''}">Issues ${openIssues.length}</span>
            <span class="pill ${branches.length ? 'has-items' : ''}">Ramas ${branches.length}</span>
            <span class="pill">Commits ${commits.length}</span>
            <span class="pill ${comments.length ? 'has-items' : ''}">Comentarios PR ${comments.length}</span>
          </div>

          ${branches.length ? `
            <div class="section-title">Seleccionar Rama (${branches.length})</div>
            <div class="branches-wrap">
              ${branches.map(b => `
                <button class="branch-btn ${b.name === currentBranchName ? 'active' : ''}" data-branch="${escapeHtml(b.name)}">
                  <span>🌿 ${escapeHtml(b.name)} ${b.author ? `<span class="branch-author">(@${escapeHtml(b.author)})</span>` : ''}</span>
                  <a href="${b.url}" target="_blank" rel="noopener" class="branch-ext" title="Abrir en GitHub" onclick="event.stopPropagation()">↗</a>
                </button>
              `).join('')}
            </div>
          ` : ''}

          ${openPRs.length ? `
            <div class="section-title">Pull Requests</div>
            ${openPRs.map(p => `
              <div class="list-item">
                <span class="badge badge-pr">PR #${p.number}</span>
                <a href="${p.url}" target="_blank" rel="noopener" class="item-title">${escapeHtml(p.title || '')}</a>
              </div>
            `).join('')}
          ` : ''}

          ${comments.length ? `
            <div class="section-title">Últimos Comentarios en PRs</div>
            ${comments.slice(0, 3).map(c => `
              <div class="comment-box">
                <a href="${c.html_url || '#'}" target="_blank" rel="noopener">@${escapeHtml(c.user || 'usuario')}</a>: 
                <span>"${escapeHtml(c.body || '')}"</span>
              </div>
            `).join('')}
          ` : ''}

          ${openIssues.length ? `
            <div class="section-title">Issues Abiertos</div>
            ${openIssues.map(i => `
              <div class="list-item">
                <span class="badge badge-open">#${i.number}</span>
                <a href="${i.url}" target="_blank" rel="noopener" class="item-title">${escapeHtml(i.title || '')}</a>
              </div>
            `).join('')}
          ` : ''}

          <div class="section-title">
            Commits <span class="branch-label">[${escapeHtml(currentBranchName)}]</span>
          </div>
          <div class="commits-container">
            ${renderCommitsList(commits)}
          </div>
        `;

        // Event delegation for branch switching within card
        card.querySelectorAll('.branch-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            const targetBtn = e.currentTarget;
            const branchName = targetBtn.dataset.branch;
            if (!branchName) return;

            activeBranchMap[r.repo] = branchName;

            // Highlight active button
            card.querySelectorAll('.branch-btn').forEach(b => b.classList.toggle('active', b === targetBtn));

            // Find new branch object
            const bObj = branches.find(b => b.name === branchName);
            const bCommits = (bObj && bObj.commits) ? bObj.commits : [];

            // Update branch label and commits container directly
            const labelEl = card.querySelector('.branch-label');
            if (labelEl) labelEl.textContent = `[${branchName}]`;

            const containerEl = card.querySelector('.commits-container');
            if (containerEl) containerEl.innerHTML = renderCommitsList(bCommits);
          });
        });

        main.appendChild(card);
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
