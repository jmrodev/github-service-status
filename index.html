<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub Service Status — Vista Gráfica e Historial Completo</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --btn-active: #1f6feb;
      --badge-open: #238636;
      --badge-closed: #da3633;
      --badge-merged: #8957e5;
      --badge-pending: #d97706;
      --badge-default: #1f6feb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.6;
    }
    header {
      padding: 20px 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
    }
    .brand { font-size: 22px; font-weight: 700; color: #f0f6fc; }
    .meta { color: var(--text-muted); font-size: 13px; }
    
    .filter-container {
      padding: 20px 32px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      border-bottom: 1px solid var(--border);
      background: #161b22;
    }
    .filters-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-label { font-size: 13px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; margin-right: 6px; }
    
    button {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover { background: #21262d; border-color: var(--accent); }
    button.on { background: var(--btn-active); border-color: var(--btn-active); color: #fff; font-weight: 600; }
    
    .repo-pill {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 6px 16px;
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .repo-pill:hover { border-color: var(--accent); color: #fff; }
    .repo-pill.on { background: var(--btn-active); border-color: var(--btn-active); color: #fff; font-weight: 600; }
    
    main {
      padding: 32px;
      width: 100%;
      max-width: 1800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .full-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
    }
    .full-card h2 { margin: 0; font-size: 24px; word-break: break-word; }
    .full-card h2 a { color: var(--accent); text-decoration: none; }
    .full-card h2 a:hover { text-decoration: underline; }

    /* DASHBOARD GRÁFICO VISUAL */
    .graphic-dashboard {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px 24px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }
    .chart-box { display: flex; flex-direction: column; gap: 8px; }
    .chart-title { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; display: flex; justify-content: space-between; }
    
    .progress-bar-wrap {
      height: 14px;
      background: #21262d;
      border-radius: 7px;
      overflow: hidden;
      display: flex;
      width: 100%;
    }
    .progress-segment { height: 100%; transition: width 0.3s ease; }
    .segment-open { background: var(--badge-open); }
    .segment-merged { background: var(--badge-merged); }
    .segment-closed { background: var(--badge-closed); }
    .segment-pending { background: var(--badge-pending); }

    .chart-legend { display: flex; gap: 12px; font-size: 12px; flex-wrap: wrap; color: var(--text-muted); }
    .legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }

    .sections-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
      gap: 24px;
    }

    .section {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .section-title { font-weight: 700; font-size: 14px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    
    .list-item { font-size: 14px; padding: 10px 0; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; border-bottom: 1px dashed #21262d; }
    .list-item:last-child { border-bottom: none; }
    .list-item a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .list-item a:hover { text-decoration: underline; }
    .item-title { color: var(--text); word-break: break-word; white-space: normal; flex: 1; }
    .author-tag { color: var(--text-muted); font-size: 13px; font-weight: 500; }
    
    .branches-wrap { display: flex; gap: 8px; flex-wrap: wrap; }
    
    .branch-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-family: monospace;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      user-select: none;
    }
    .branch-btn:hover { background: #21262d; border-color: var(--accent); }
    .branch-btn.active { background: var(--btn-active); border-color: var(--btn-active); color: #fff; font-weight: 600; }
    .branch-btn.is-merged { border-color: #238636; }
    .branch-btn.is-pending { border-color: #d97706; }
    
    .branch-status-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .branch-status-default { background: var(--badge-default); color: #fff; }
    .branch-status-merged { background: var(--badge-open); color: #fff; }
    .branch-status-pending { background: var(--badge-pending); color: #fff; }

    .branch-author { opacity: 0.85; font-size: 12px; font-weight: normal; margin-left: 2px; }
    .branch-ext { color: var(--text-muted); font-size: 13px; text-decoration: none; margin-left: 4px; }
    .branch-ext:hover { color: var(--accent); }
    
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
    }
    .badge-open { background: var(--badge-open); }
    .badge-closed { background: var(--badge-closed); }
    .badge-merged { background: var(--badge-merged); }
    .badge-pending { background: var(--badge-pending); }

    .empty-state { color: var(--text-muted); font-style: italic; font-size: 14px; padding: 6px 0; }
    code { font-family: monospace; font-size: 13px; background: var(--card-bg); padding: 3px 8px; border-radius: 4px; }
    .comment-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; font-size: 14px; word-break: break-word; white-space: normal; line-height: 1.6; margin-bottom: 8px; }
    .comment-box a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .date-tag { color: var(--text-muted); font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <div>
      <span class="brand">GitHub Service Status — Vista Gráfica e Historial Completo</span>
    </div>
    <div class="meta" id="meta-info">Cargando...</div>
  </header>

  <div class="filter-container">
    <div class="filters-row" id="org-filter-row">
      <span class="filter-label">Organización / Usuario:</span>
    </div>
    <div class="filters-row" id="repo-filter-row">
      <span class="filter-label">Repositorios:</span>
      <div id="repo-pills" style="display: flex; gap: 8px; flex-wrap: wrap;"></div>
    </div>
  </div>

  <main id="main-content"></main>

  <script>
    let rawData = null;
    let selectedOrg = 'all';
    let selectedRepo = 'all';
    const activeBranchMap = {};

    fetch('./status.json')
      .then(res => res.json())
      .then(data => {
        rawData = data;
        initFilters();
        render();
      })
      .catch(err => {
        document.getElementById('meta-info').textContent = 'Error al cargar status.json';
        console.error(err);
      });

    function initFilters() {
      const orgRow = document.getElementById('org-filter-row');
      const formattedDate = new Date(rawData.generated_at).toLocaleString();
      document.getElementById('meta-info').textContent = `Generado: ${formattedDate} (${rawData.mode || 'live'}) · Repos: ${rawData.total_repos || rawData.repos.length}`;

      const orgs = new Set();
      (rawData.repos || []).forEach(r => {
        if (r.repo && r.repo.includes('/')) {
          const parts = r.repo.split('/');
          orgs.add(parts[0]);
        }
      });

      const orgList = Array.from(orgs);
      if (orgList.length > 0) {
        selectedOrg = orgList[0];
      }

      orgList.forEach(org => {
        const btn = document.createElement('button');
        btn.dataset.org = org;
        btn.className = (selectedOrg === org ? 'on' : '');
        btn.textContent = org;
        orgRow.appendChild(btn);
      });

      orgRow.querySelectorAll('button').forEach(btn => {
        btn.onclick = () => {
          selectedOrg = btn.dataset.org;
          orgRow.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === btn));
          updateRepoPills(true);
          render();
        };
      });

      updateRepoPills(true);
    }

    function updateRepoPills(resetToFirst = false) {
      const repoPillsContainer = document.getElementById('repo-pills');
      repoPillsContainer.innerHTML = '';

      const availableRepos = (rawData.repos || []).filter(r => r.repo.startsWith(selectedOrg + '/'));

      if (resetToFirst && availableRepos.length > 0) {
        selectedRepo = availableRepos[0].repo;
      }

      availableRepos.forEach(r => {
        const repoName = r.repo.split('/')[1];
        const btn = document.createElement('button');
        btn.className = 'repo-pill ' + (selectedRepo === r.repo ? 'on' : '');
        btn.textContent = repoName;
        btn.onclick = () => {
          selectedRepo = r.repo;
          repoPillsContainer.querySelectorAll('.repo-pill').forEach(p => p.classList.toggle('on', p === btn));
          render();
        };
        repoPillsContainer.appendChild(btn);
      });
    }

    function renderCommitsList(commits) {
      if (!commits || !commits.length) {
        return '<div class="empty-state">Sin commits registrados</div>';
      }
      return commits.map(c => `
        <div class="list-item">
          <a href="${c.html_url || '#'}" target="_blank" rel="noopener"><code>${escapeHtml(c.sha || '')}</code></a>
          ${c.is_incorporated ? '<span class="badge badge-open">INCORPORADO</span>' : '<span class="badge badge-pending">PENDIENTE DE MERGE</span>'}
          ${c.author ? `<span class="author-tag">@${escapeHtml(c.author)}</span>` : ''}
          <span class="item-title">${escapeHtml(c.msg || '')}</span>
        </div>
      `).join('');
    }

    function getBadge(state) {
      if (!state) return '<span class="badge badge-open">ABIERTO</span>';
      const st = String(state).toUpperCase();
      if (st === 'MERGED') return '<span class="badge badge-merged">FUSIONADO</span>';
      if (st === 'CLOSED') return '<span class="badge badge-closed">RESUELTO</span>';
      return '<span class="badge badge-open">ABIERTO</span>';
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      try {
        return new Date(dateStr).toLocaleDateString();
      } catch (e) {
        return '';
      }
    }

    function render() {
      const main = document.getElementById('main-content');
      main.innerHTML = '';

      if (!rawData || !rawData.repos) return;

      const filtered = rawData.repos.filter(r => r.repo === selectedRepo);

      if (filtered.length === 0) {
        main.innerHTML = '<div class="empty-state">Seleccioná un repositorio en las pastillas superiores.</div>';
        return;
      }

      filtered.forEach(r => {
        const card = document.createElement('div');
        card.className = 'full-card';
        card.dataset.repo = r.repo;

        const issues = (r.issues || []);
        const prs = (r.prs || []);
        const branches = (r.branches && Array.isArray(r.branches)) ? r.branches : [];
        const comments = (r.comments && Array.isArray(r.comments)) ? r.comments : [];

        // Active branch selection
        if (!activeBranchMap[r.repo] && branches.length > 0) {
          activeBranchMap[r.repo] = branches[0].name;
        }
        const currentBranchName = activeBranchMap[r.repo] || (branches[0] ? branches[0].name : '');
        const currentBranchObj = branches.find(b => b.name === currentBranchName) || branches[0];
        const commits = (currentBranchObj && currentBranchObj.commits) ? currentBranchObj.commits : (r.commits || []);

        // Compute graphical metrics percentages
        const totalPrs = prs.length || 1;
        const prOpenPct = Math.round(((prs.filter(p => String(p.state).toUpperCase() === 'OPEN').length) / totalPrs) * 100);
        const prMergedPct = Math.round(((prs.filter(p => String(p.state).toUpperCase() === 'MERGED').length) / totalPrs) * 100);
        const prClosedPct = Math.max(0, 100 - prOpenPct - prMergedPct);

        const totalIssues = issues.length || 1;
        const issueOpenPct = Math.round(((issues.filter(i => String(i.state).toUpperCase() === 'OPEN').length) / totalIssues) * 100);
        const issueClosedPct = Math.max(0, 100 - issueOpenPct);

        const totalBranches = branches.length || 1;
        const branchMergedPct = Math.round(((branches.filter(b => b.is_merged).length) / totalBranches) * 100);
        const branchPendingPct = Math.max(0, 100 - branchMergedPct);

        card.innerHTML = `
          <h2><a href="${r.url}" target="_blank" rel="noopener">${escapeHtml(r.repo)}</a></h2>
          
          <!-- DASHBOARD GRÁFICO DE BARRAS DE PROGRESO -->
          <div class="graphic-dashboard">
            <!-- GRÁFICO PRs -->
            <div class="chart-box">
              <div class="chart-title">
                <span>Pull Requests (${prs.length})</span>
                <span>${prMergedPct}% Fusionados</span>
              </div>
              <div class="progress-bar-wrap">
                <div class="progress-segment segment-merged" style="width: ${prMergedPct}%" title="${prMergedPct}% Fusionados"></div>
                <div class="progress-segment segment-open" style="width: ${prOpenPct}%" title="${prOpenPct}% Abiertos"></div>
                <div class="progress-segment segment-closed" style="width: ${prClosedPct}%" title="${prClosedPct}% Cerrados"></div>
              </div>
              <div class="chart-legend">
                <span><span class="legend-dot" style="background: var(--badge-merged);"></span>Fusionados (${prs.filter(p => String(p.state).toUpperCase() === 'MERGED').length})</span>
                <span><span class="legend-dot" style="background: var(--badge-open);"></span>Abiertos (${prs.filter(p => String(p.state).toUpperCase() === 'OPEN').length})</span>
                <span><span class="legend-dot" style="background: var(--badge-closed);"></span>Cerrados (${prs.filter(p => String(p.state).toUpperCase() === 'CLOSED').length})</span>
              </div>
            </div>

            <!-- GRÁFICO ISSUES -->
            <div class="chart-box">
              <div class="chart-title">
                <span>Issues (${issues.length})</span>
                <span>${issueClosedPct}% Resueltos</span>
              </div>
              <div class="progress-bar-wrap">
                <div class="progress-segment segment-open" style="width: ${issueClosedPct}%" title="${issueClosedPct}% Resueltos"></div>
                <div class="progress-segment segment-closed" style="width: ${issueOpenPct}%" title="${issueOpenPct}% Abiertos"></div>
              </div>
              <div class="chart-legend">
                <span><span class="legend-dot" style="background: var(--badge-open);"></span>Resueltos (${issues.filter(i => String(i.state).toUpperCase() === 'CLOSED').length})</span>
                <span><span class="legend-dot" style="background: var(--badge-closed);"></span>Abiertos (${issues.filter(i => String(i.state).toUpperCase() === 'OPEN').length})</span>
              </div>
            </div>

            <!-- GRÁFICO RAMAS -->
            <div class="chart-box">
              <div class="chart-title">
                <span>Ramas (${branches.length})</span>
                <span>${branchMergedPct}% Incorporadas</span>
              </div>
              <div class="progress-bar-wrap">
                <div class="progress-segment segment-open" style="width: ${branchMergedPct}%" title="${branchMergedPct}% Incorporadas"></div>
                <div class="progress-segment segment-pending" style="width: ${branchPendingPct}%" title="${branchPendingPct}% Pendientes"></div>
              </div>
              <div class="chart-legend">
                <span><span class="legend-dot" style="background: var(--badge-open);"></span>Incorporadas (${branches.filter(b => b.is_merged).length})</span>
                <span><span class="legend-dot" style="background: var(--badge-pending);"></span>Pendientes (${branches.filter(b => !b.is_merged).length})</span>
              </div>
            </div>
          </div>

          <!-- SECCIÓN DE RAMAS (ANCHO COMPLETO) -->
          <div class="section">
            <div class="section-title">Ramas del Repositorio (${branches.length}) — Seleccioná una para explorar sus commits</div>
            ${branches.length ? `
              <div class="branches-wrap">
                ${branches.map(b => {
                  let statusBadge = '<span class="branch-status-badge branch-status-pending">PENDIENTE</span>';
                  if (b.is_default) {
                    statusBadge = '<span class="branch-status-badge branch-status-default">PRINCIPAL</span>';
                  } else if (b.is_merged) {
                    statusBadge = '<span class="branch-status-badge branch-status-merged">INCORPORADA</span>';
                  } else if (b.ahead_by > 0) {
                    statusBadge = `<span class="branch-status-badge branch-status-pending">+${b.ahead_by} COMMITS</span>`;
                  }
                  
                  const branchClass = b.is_merged ? 'is-merged' : 'is-pending';

                  return `
                    <button class="branch-btn ${branchClass} ${b.name === currentBranchName ? 'active' : ''}" data-branch="${escapeHtml(b.name)}">
                      <span>🌿 ${escapeHtml(b.name)} ${b.author ? `<span class="branch-author">(@${escapeHtml(b.author)})</span>` : ''}</span>
                      ${statusBadge}
                      <a href="${b.url}" target="_blank" rel="noopener" class="branch-ext" title="Abrir en GitHub" onclick="event.stopPropagation()">↗</a>
                    </button>
                  `;
                }).join('')}
              </div>
            ` : '<div class="empty-state">Sin ramas secundarias</div>'}
          </div>

          <!-- GRID DE SECCIONES A DOS COLUMNAS ANCHAS -->
          <div class="sections-grid">
            <!-- COLUMNA IZQUIERDA: COMMITS & PRS -->
            <div style="display: flex; flex-direction: column; gap: 24px;">
              <!-- COMMITS -->
              <div class="section">
                <div class="section-title">
                  Historial de Commits en <span class="branch-label">[${escapeHtml(currentBranchName)}]</span> (${commits.length})
                </div>
                <div class="commits-container">
                  ${renderCommitsList(commits)}
                </div>
              </div>

              <!-- PULL REQUESTS -->
              <div class="section">
                <div class="section-title">Historial de Pull Requests (${prs.length})</div>
                ${prs.length ? prs.map(p => `
                  <div class="list-item">
                    ${getBadge(p.state)}
                    <a href="${p.url}" target="_blank" rel="noopener" class="item-title">PR #${p.number} — ${escapeHtml(p.title || '')}</a>
                    ${p.createdAt ? `<span class="date-tag">${formatDate(p.createdAt)}</span>` : ''}
                  </div>
                `).join('') : '<div class="empty-state">Sin pull requests registrados</div>'}
              </div>
            </div>

            <!-- COLUMNA DERECHA: COMENTARIOS & ISSUES -->
            <div style="display: flex; flex-direction: column; gap: 24px;">
              <!-- COMENTARIOS -->
              <div class="section">
                <div class="section-title">Historial de Comentarios en PRs (${comments.length})</div>
                ${comments.length ? comments.map(c => `
                  <div class="comment-box">
                    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px;">
                      <a href="${c.html_url || '#'}" target="_blank" rel="noopener">@${escapeHtml(c.user || 'usuario')}</a>
                      ${c.created_at ? `<span class="date-tag">${formatDate(c.created_at)}</span>` : ''}
                    </div>
                    <div>"${escapeHtml(c.body || '')}"</div>
                  </div>
                `).join('') : '<div class="empty-state">Sin comentarios registrados</div>'}
              </div>

              <!-- ISSUES -->
              <div class="section">
                <div class="section-title">Historial de Issues (${issues.length})</div>
                ${issues.length ? issues.map(i => `
                  <div class="list-item">
                    ${getBadge(i.state)}
                    <a href="${i.url}" target="_blank" rel="noopener" class="item-title">#${i.number} — ${escapeHtml(i.title || '')}</a>
                    ${i.createdAt ? `<span class="date-tag">${formatDate(i.createdAt)}</span>` : ''}
                  </div>
                `).join('') : '<div class="empty-state">Sin issues registrados</div>'}
              </div>
            </div>
          </div>
        `;

        // Branch selector click handler
        card.querySelectorAll('.branch-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            const targetBtn = e.currentTarget;
            const branchName = targetBtn.dataset.branch;
            if (!branchName) return;

            activeBranchMap[r.repo] = branchName;

            card.querySelectorAll('.branch-btn').forEach(b => b.classList.toggle('active', b === targetBtn));

            const bObj = branches.find(b => b.name === branchName);
            const bCommits = (bObj && bObj.commits) ? bObj.commits : [];

            card.querySelectorAll('.branch-label').forEach(el => el.textContent = `[${branchName}]`);
            card.querySelectorAll('.commits-container').forEach(el => el.innerHTML = renderCommitsList(bCommits));
          });
        });

        main.appendChild(card);
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
